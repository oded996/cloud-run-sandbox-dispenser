apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sandbox-ui
  labels:
    cloud.googleapis.com/location: us-west1
  annotations:
    run.googleapis.com/launch-stage: ALPHA
    run.googleapis.com/ingress: all
    run.googleapis.com/iap-enabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - name: ui
        image: IMAGE_URI_PLACEHOLDER
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: DISPENSER_MODE
          value: ui
        - name: GOOGLE_CLOUD_PROJECT
          value: PROJECT_ID_PLACEHOLDER
        - name: GCS_BUCKET_NAME
          value: BUCKET_NAME_PLACEHOLDER
        - name: POOL_SERVICE_URL
          value: POOL_SERVICE_URL_PLACEHOLDER
        - name: CONTROL_PLANE_URL
          value: CONTROL_PLANE_URL_PLACEHOLDER
        - name: DEPLOYER_EMAIL
          value: DEPLOYER_EMAIL_PLACEHOLDER
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
  traffic:
  - latestRevision: true
    percent: 100
